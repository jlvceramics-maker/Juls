<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { createRenderer } from './gl.js';
  import { PALETTES } from './palettes.js';
  const q = new URLSearchParams(location.search);
  const pal = { ...PALETTES[q.get('style')][q.get('mode')] };
  // ?grain=0 глушит зерно — так проверяется периодичность без случайного шума
  if (q.has('grain')) pal.grain = Number(q.get('grain'));
  const draw = createRenderer(document.getElementById('c'), q.get('style'), pal);
  window.__draw = phase => { draw(phase); return true; };
  window.__ready = true;
</script>
